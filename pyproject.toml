[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homedant-linkedin"
version = "0.1.0"
description = "LinkedIn content agent for HOMEDANT USA"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
homedant-linkedin = "homedant_linkedin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
homedant_linkedin = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
